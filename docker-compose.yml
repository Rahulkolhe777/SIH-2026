services:
  postgres:
    image: postgres:16-alpine
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih_db
    ports:
      - "5433:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sih_pgdata:
    driver: local
